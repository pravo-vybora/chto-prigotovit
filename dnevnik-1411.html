<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дневник: голод и усталость</title>
<style>
  :root { --bg:#ffffff; --card:#f6f7f9; --text:#1f2328; --muted:#6a7079; --accent:#b5541f; --line:#e3e6ea; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16181b; --card:#202328; --text:#eceef1; --muted:#9ba1a9; --accent:#e08a4f; --line:#30343a; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:20px 16px 60px; }
  .wrap { max-width:640px; margin:0 auto; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 10px; font-size:.92rem; line-height:1.4; }
  .nav { display:flex; gap:14px; flex-wrap:wrap; margin:0 0 16px; font-size:.9rem; }
  .nav a { color:var(--accent); text-decoration:none; border-bottom:1px solid var(--line); }
  .tabs { display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin:0 0 14px; }
  .tabs button { flex:0 0 auto; min-width:54px; padding:8px; border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:8px; font-size:.9rem; cursor:pointer; line-height:1.15; }
  .tabs button small { display:block; font-size:.72rem; color:var(--muted); }
  .tabs button.on { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .tabs button.on small { color:#fff; }
  .tabs button.done:not(.on) { border-color:var(--accent); }
  .row { border-bottom:1px solid var(--line); padding:12px 0; }
  .q { font-size:.95rem; margin:0 0 8px; }
  .q small { color:var(--muted); display:block; font-size:.8rem; margin-top:2px; }
  .scale { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .scale button, .opts button { padding:10px 0; border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:8px; font-size:1rem; cursor:pointer; }
  .opts { display:flex; flex-wrap:wrap; gap:6px; }
  .opts button { padding:9px 12px; font-size:.9rem; }
  .scale button.on, .opts button.on { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  input[type=number], textarea { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font-size:1rem; font-family:inherit; }
  textarea { min-height:60px; }
  .box { background:var(--card); border-radius:10px; padding:12px 14px; margin:18px 0 0; font-size:.9rem; line-height:1.5; }
  .box b { font-weight:600; }
  .act { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  .act button { padding:12px; border:1px solid var(--accent); background:transparent; color:var(--accent); border-radius:8px; font-size:.92rem; cursor:pointer; }
  .ok { color:var(--muted); font-size:.85rem; min-height:1.2em; margin-top:6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Дневник 14.11–27.11 (прошлое меню)</h1>
  <p class="sub">Раз в день вечером, минута. Голод: 0 — нет, 1 — лёгкий фоновый, 2 — заметный, 3 — сильный. Данные хранятся только на этом телефоне, итог можно скопировать тренеру.</p>
  <div class="nav"><a href="index.html">Что приготовить</a><a href="menu.html">Меню</a><a href="pokupki.html">Закупка</a></div>
  <div class="tabs" id="tabs"></div>
  <div id="form"></div>
  <div class="box" id="sum"></div>
  <div class="act"><button id="copy">Скопировать итог для тренера</button><button id="csv">Скачать таблицу (CSV)</button></div>
  <div class="ok" id="ok"></div>
</div>
<script>
(function () {
  var DATES = ["сб 14.11", "вс 15.11", "пн 16.11", "вт 17.11", "ср 18.11", "чт 19.11", "пт 20.11", "сб 21.11", "вс 22.11", "пн 23.11", "вт 24.11", "ср 25.11", "чт 26.11", "пт 27.11"];
  var KEY = 'dnevnik-1411';
  var st = {};
  try { st = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { st = {}; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  var F = [
    {k: 'gm', t: 'Голод утром', s: true}, {k: 'gd', t: 'Голод днём', s: true}, {k: 'ge', t: 'Голод вечером', s: true},
    {k: 'ust', t: 'Усталость', h: '0 — бодро, 3 — тяжело', s: true},
    {k: 'son', t: 'Сон, часов', n: true, step: '0.5'},
    {k: 'tr', t: 'Тренировка', o: ['нет', 'силовая', 'ОФП', 'бассейн', 'прогулка 8000+']},
    {k: 'ves', t: 'Вес утром, кг', h: 'по желанию', n: true, step: '0.1'},
    {k: 'zam', t: 'Заметка', h: 'что съела не по меню, самочувствие', txt: true}
  ];
  var start = new Date(2026, 10, 14);
  var today = Math.floor((new Date() - start) / 86400000) + 1;
  var cur = (today >= 1 && today <= 14) ? today : 1;
  var tabs = document.getElementById('tabs'), form = document.getElementById('form');
  function filled(i) { var d = st[i]; return d && (d.gm != null || d.gd != null || d.ge != null || d.ust != null); }
  function drawTabs() {
    tabs.innerHTML = DATES.map(function (d, i) {
      var n = i + 1;
      return '<button data-d="' + n + '" class="' + (n === cur ? 'on ' : '') + (filled(n) ? 'done' : '') + '">Д' + n + '<small>' + d.slice(3, 8) + '</small></button>';
    }).join('');
    tabs.querySelectorAll('button').forEach(function (b) { b.onclick = function () { cur = +b.dataset.d; draw(); }; });
  }
  function draw() {
    drawTabs();
    var d = st[cur] || {};
    form.innerHTML = '<h2 style="font-size:1.1rem;margin:4px 0 6px">День ' + cur + ' · ' + DATES[cur - 1] + '</h2>' + F.map(function (f) {
      var h = '<div class="row"><div class="q">' + f.t + (f.h ? '<small>' + f.h + '</small>' : '') + '</div>';
      if (f.s) h += '<div class="scale">' + [0, 1, 2, 3].map(function (v) { return '<button data-k="' + f.k + '" data-v="' + v + '" class="' + (d[f.k] === v ? 'on' : '') + '">' + v + '</button>'; }).join('') + '</div>';
      else if (f.o) h += '<div class="opts">' + f.o.map(function (v) { return '<button data-k="' + f.k + '" data-o="' + v + '" class="' + (d[f.k] === v ? 'on' : '') + '">' + v + '</button>'; }).join('') + '</div>';
      else if (f.n) h += '<input type="number" inputmode="decimal" step="' + f.step + '" data-k="' + f.k + '" value="' + (d[f.k] != null ? d[f.k] : '') + '">';
      else h += '<textarea data-k="' + f.k + '">' + (d[f.k] || '') + '</textarea>';
      return h + '</div>';
    }).join('');
    form.querySelectorAll('button[data-k]').forEach(function (b) {
      b.onclick = function () {
        var o = st[cur] = st[cur] || {};
        var v = b.dataset.v != null ? +b.dataset.v : b.dataset.o;
        o[b.dataset.k] = (o[b.dataset.k] === v) ? null : v;
        save(); draw();
      };
    });
    form.querySelectorAll('input,textarea').forEach(function (el) {
      el.oninput = function () {
        var o = st[cur] = st[cur] || {};
        o[el.dataset.k] = el.tagName === 'INPUT' ? (el.value === '' ? null : parseFloat(el.value.replace(',', '.'))) : el.value;
        save(); summary(); drawTabs();
      };
    });
    summary();
  }
  function avg(k) { var s = 0, n = 0; for (var i = 1; i <= 14; i++) { var v = st[i] && st[i][k]; if (typeof v === 'number') { s += v; n++; } } return n ? Math.round(s / n * 10) / 10 : '—'; }
  function summaryText() {
    var hungry = 0, tr = 0, w = [];
    for (var i = 1; i <= 14; i++) {
      var d = st[i] || {};
      if ((d.gm >= 2) || (d.gd >= 2) || (d.ge >= 2)) hungry++;
      if (d.tr && d.tr !== 'нет' && d.tr !== 'прогулка 8000+') tr++;
      if (typeof d.ves === 'number') w.push(d.ves);
    }
    return 'Итог за 14 дней (14.11–27.11): голод утром ' + avg('gm') + ', днём ' + avg('gd') + ', вечером ' + avg('ge') +
      ' (шкала 0–3); дней с голодом 2–3: ' + hungry + '; усталость в среднем ' + avg('ust') + ' из 3; сон ' + avg('son') +
      ' ч; тренировок ' + tr + (w.length ? '; вес ' + w[0] + ' → ' + w[w.length - 1] + ' кг' : '') + '.';
  }
  function summary() { document.getElementById('sum').innerHTML = '<b>Итог сейчас:</b> ' + summaryText(); }
  function flash(t) { var o = document.getElementById('ok'); o.textContent = t; setTimeout(function () { o.textContent = ''; }, 2500); }
  document.getElementById('copy').onclick = function () {
    var t = summaryText();
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(function () { flash('Скопировано'); }, function () { flash(t); });
    else flash(t);
  };
  document.getElementById('csv').onclick = function () {
    var rows = [['Дата', 'День', 'Голод утром', 'Голод днём', 'Голод вечером', 'Усталость', 'Сон, ч', 'Тренировка', 'Вес, кг', 'Заметка']];
    for (var i = 1; i <= 14; i++) {
      var d = st[i] || {};
      rows.push([DATES[i - 1], 'Д' + i, d.gm, d.gd, d.ge, d.ust, d.son, d.tr, d.ves, d.zam].map(function (v) { return v == null ? '' : String(v).replace(/"/g, '""'); }));
    }
    var csv = '﻿' + rows.map(function (r) { return r.map(function (v) { return '"' + v + '"'; }).join(';'); }).join('\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv;charset=utf-8'}));
    a.download = 'dnevnik-14-27-noyabrya.csv'; a.click();
  };
  draw();
})();
</script>
</body>
</html>
