  .sub {

  .filters {

    gap: 8px;
    margin-bottom: 20px;
  }
  .filter-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
    min-width: 140px;
  }
  .filter-label {
    font-size: 0.78rem;
    color: var(--muted);

    letter-spacing: 0.03em;
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .chip {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 0.85rem;
    cursor: pointer;
    user-select: none;
  }
  .chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .main-btn {
    width: 100%;
    padding: 16px;
    font-size: 1.05rem;
    font-weight: 600;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    margin: 10px 0 8px;
  }
  .main-btn:active { opacity: 0.85; }
  .secondary-btn {
    width: 100%;
    padding: 12px;
    font-size: 0.95rem;
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 20px;
    display: none;
  }
  .count {
    color: var(--muted);
    font-size: 0.85rem;
    margin: -4px 0 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    display: none;
  }
  .card.show { display: block; }
  .card-title {
    font-size: 1.25rem;
    font-weight: 700;
    margin: 0 0 6px;
  }
  .tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .tag {
    background: var(--accent-soft);
    color: var(--accent);
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 0.78rem;
    font-weight: 600;
  }
  .section-label {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--muted);
    margin: 16px 0 8px;
  }
  .ingredients {
    margin: 0;

  .steps {
    margin: 0;
    padding-left: 20px;
  }

  }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 20px;
    display: none;
  }
  .empty.show { display: block; }
</style>
</head>

const timeFilters = [
  { label: "≤5 мин", max: 5 },
  { label: "≤10 мин", max: 10 },
  { label: "≤15 мин", max: 15 },
  { label: "≤30 мин", max: 30 },
  { label: "Любое", max: Infinity }
];
const typeFilters = ["Любой", "завтрак", "перекус", "обед", "ужин"];

let activeTime = timeFilters[timeFilters.length - 1];
let activeType = "Любой";
let lastShown = null;

const timeChips = document.getElementById('timeChips');
const typeChips = document.getElementById('typeChips');

timeFilters.forEach(tf => {
  const el = document.createElement('div');
  el.className = 'chip' + (tf === activeTime ? ' active' : '');
  el.textContent = tf.label;
  el.onclick = () => {
    activeTime = tf;
    [...timeChips.children].forEach(c => c.classList.remove('active'));
    el.classList.add('active');
  };
  timeChips.appendChild(el);
});

typeFilters.forEach(t => {
  const el = document.createElement('div');
  el.className = 'chip' + (t === activeType ? ' active' : '');
  el.textContent = t;
  el.onclick = () => {
    activeType = t;
    [...typeChips.children].forEach(c => c.classList.remove('active'));
    el.classList.add('active');
  };
  typeChips.appendChild(el);
});

function getFiltered() {
  return RECIPES.filter(r => {
    const timeOk = r.time <= activeTime.max;
    const typeOk = activeType === "Любой" || r.type.includes(activeType);
    return timeOk && typeOk;
  });
}

function renderRecipe(r) {
  document.getElementById('rTitle').textContent = r.title;
  document.getElementById('rTags').innerHTML =
    `<span class="tag">${r.timeLabel}</span>${r.type.map(t => `<span class="tag">${t}</span>`).join('')}<span class="tag">${r.cuisine}</span>`;
  document.getElementById('rIngredients').innerHTML =
    r.ingredients.map(i => `<li>${i}</li>`).join('');
  document.getElementById('rSteps').innerHTML =
    r.steps.map(s => `<li>${s}</li>`).join('');
  document.getElementById('card').classList.add('show');
  document.getElementById('emptyState').classList.remove('show');
  document.getElementById('anotherBtn').style.display = 'block';
}

function pickRecipe() {
  const pool = getFiltered();
  document.getElementById('countLabel').textContent =
    pool.length ? `Подходит рецептов: ${pool.length}` : '';
  if (!pool.length) {
    document.getElementById('card').classList.remove('show');
    document.getElementById('emptyState').classList.add('show');
    document.getElementById('anotherBtn').style.display = 'none';
    return;
  }
  let choice;
  if (pool.length === 1) {
    choice = pool[0];
  } else {
    do {
      choice = pool[Math.floor(Math.random() * pool.length)];
    } while (choice === lastShown);
  }
  lastShown = choice;
  renderRecipe(choice);
}

document.getElementById('mainBtn').onclick = pickRecipe;
document.getElementById('anotherBtn').onclick = pickRecipe;
</script>
